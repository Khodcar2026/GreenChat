<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ecffe0">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>GreenChat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23bff590'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--gum:#bff590;--gum-d:#8fe65c;--gum-l:#d9fcc0;--gum-t:#f3fff0;--ink:#0c3a1d;--tx:#12301e;--mut:#5f7f6a;--line:rgba(110,190,80,.25);--on:#16c34a;--off:#ef4444;--ease:cubic-bezier(.2,1.3,.4,1);color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Vazirmatn,'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;background:#fff;color:var(--tx);font-size:14.5px}
button,input{font:inherit;color:inherit}
button{border-radius:999px;-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;position:relative;cursor:pointer;border:0;background:none;transition:transform .45s var(--ease),background .2s,opacity .2s}
@media(hover:hover){.btn:hover:not(:active),.chip:hover:not(:active),.ibtn:hover:not(:active),.fab:hover:not(:active),.fab2:hover:not(:active),.lbtn:hover:not(:active){transform:translateY(-2px)}}
button:active{transform:scale(.92);transition-duration:.08s}
.rpw{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rp .65s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
@keyframes fly{40%{translate:-18px -18px;opacity:0}41%{translate:18px 18px;opacity:0}100%{translate:0 0;opacity:1}}
#snd.fly i{animation:fly .5s cubic-bezier(.5,0,.3,1)}
html[dir=ltr] #snd.fly i{animation-name:flyl}
@keyframes flyl{40%{translate:18px -18px;opacity:0}41%{translate:-18px 18px;opacity:0}100%{translate:0 0;opacity:1}}
.opt.on>i:last-of-type{animation:pop .4s var(--ease)}
:focus-visible{outline:3px solid var(--gum-d);outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
.hide{display:none!important}
i.fa-solid{font-size:16px;line-height:1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes floaty{50%{transform:translateY(-7px)}}
@keyframes drift{50%{transform:translate(4vmax,3vmax) scale(1.08)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(22,195,74,.5)}70%,100%{box-shadow:0 0 0 7px rgba(22,195,74,0)}}
/* background lights */
#bgfx{position:fixed;inset:0;z-index:0;background:#fff;overflow:hidden}
#bgfx i{position:absolute;border-radius:50%;filter:blur(50px);animation:drift 18s ease-in-out infinite}
#bgfx i:nth-child(1){width:60vmax;height:60vmax;left:-22vmax;top:-24vmax;background:radial-gradient(circle,rgba(120,235,80,.6),transparent 65%)}
#bgfx i:nth-child(2){width:55vmax;height:55vmax;right:-20vmax;bottom:-24vmax;background:radial-gradient(circle,rgba(160,245,110,.65),transparent 65%);animation-delay:-9s}
#bgfx i:nth-child(3){width:34vmax;height:34vmax;right:8vmax;top:6vmax;background:radial-gradient(circle,rgba(190,250,150,.5),transparent 65%);animation-delay:-4s}
/* glass */
.gl,.sh,nav,#chead,.pillin,.acard,.sheet,.tick,.langs,.onl,.seg{-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.acard,.sheet,.pillin,.tick,.langs{background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.85)}
.beta{font-style:normal;font-size:10px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(191,245,144,.85);border:1px solid rgba(12,58,29,.12);color:var(--ink);line-height:1.5}
.wm{display:inline-flex;align-items:flex-start;gap:8px}
.wm .nm{font-weight:700;line-height:1.3;color:var(--ink)}
.wm .beta{margin-top:var(--bt,5px);flex:none}
body:not(.rdy) .awrap,body:not(.rdy) .lpc{opacity:0}
/* splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#fff;transition:opacity .6s,transform .6s}
#splash::before,#splash::after{content:'';position:absolute;border-radius:50%;filter:blur(60px);width:60vmax;height:60vmax;background:radial-gradient(circle,rgba(140,240,95,.55),transparent 65%);animation:drift 12s ease-in-out infinite}
#splash::before{left:-25vmax;top:-25vmax}#splash::after{right:-25vmax;bottom:-25vmax;animation-delay:-6s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.sp>*{opacity:0}
.sp .wm{font-size:46px;--bt:11px}
.sp small{font-size:13.5px;color:var(--mut)}
.sp .bar{width:56px;height:3px;border-radius:3px;background:var(--gum-l);overflow:hidden;margin-top:10px}
body.rdy .sp .wm{animation:pop .9s var(--ease) both}
body.rdy .sp small{animation:rise .6s .7s both}
body.rdy .sp .bar{animation:rise .5s 1.1s both}
.sp .bar::after{content:'';display:block;width:40%;height:100%;border-radius:3px;background:var(--gum-d);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{from{transform:translateX(120%)}to{transform:translateX(-260%)}}
/* auth */
#auth{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:24px 16px;overflow:hidden auto}
.langs{display:inline-flex;gap:2px;padding:3px;border-radius:999px}
.langs button{padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--mut);font-weight:500}
.langs button.on{background:var(--gum);color:var(--ink);font-weight:800}
.awrap{width:100%;max-width:410px;animation:rise .7s both}
.lockup{text-align:center;margin-bottom:18px}
.lockup .wm,.lpc .wm{font-size:38px;--bt:9px}
.lockup p{font-size:13px;color:var(--mut);margin-top:2px}
#langpg{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:24px 16px;overflow:auto}
.lpc{width:100%;max-width:380px;text-align:center;animation:rise .7s both}
.lpc p{color:var(--mut);font-size:13.5px;margin:6px 0 24px;line-height:2}
.lbtn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 26px;margin-bottom:10px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1.5px solid rgba(255,255,255,.9);font-size:17px;font-weight:700;color:var(--ink)}
.lbtn small{opacity:.5;font-size:12px;font-weight:500}.lbtn:hover{background:var(--gum)}
.acard{border-radius:34px;padding:24px 22px 22px;box-shadow:0 30px 70px -40px rgba(60,150,40,.5)}
.seg{position:relative;display:flex;background:rgba(255,255,255,.55);border-radius:999px;padding:4px;margin-bottom:18px}
.seg::before{content:'';position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc(50% - 4px);border-radius:999px;background:var(--gum);transition:transform .45s var(--ease)}
.seg[data-m=login]::before{transform:translateX(-100%)}
html[dir=ltr] .seg[data-m=login]::before{transform:translateX(100%)}
.seg button{position:relative;flex:1;padding:10px;border-radius:999px;font-weight:500;color:var(--mut)}
.seg button.on{color:var(--ink);font-weight:800}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--ease),opacity .3s}
.collapse.shut{grid-template-rows:0fr;opacity:0}
.collapse>div{overflow:hidden;min-height:0}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin:0 14px 6px}
.inp{position:relative}
.inp>i{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px;pointer-events:none}
.inp .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
input[type=text],input[type=password],input[type=search]{width:100%;padding:13px 18px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.65);outline:0;transition:border-color .2s,box-shadow .2s,background .2s}
.inp input{padding-left:46px}
input:focus{border-color:var(--gum-d);background:rgba(255,255,255,.9);box-shadow:0 0 0 5px rgba(191,245,144,.35)}
input[dir=ltr]{text-align:left}
.btn{width:100%;padding:14px;border-radius:999px;background:var(--gum);color:var(--ink);font-weight:800;font-size:15px;margin-top:6px}
.btn:hover{background:var(--gum-d)}.btn:disabled{opacity:.6}
.err{color:#c62828;font-size:13px;min-height:22px;margin:2px 14px 8px}
/* app */
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-width:1180px;margin:0 auto;overflow:hidden;background:rgba(255,255,255,.28)}
#side{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sh{background:rgba(191,245,144,.42);border-radius:0 0 34px 34px;padding:max(14px,env(safe-area-inset-top)) 18px 16px;border-bottom:1px solid rgba(255,255,255,.8)}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brandline{font-size:19px;--bt:3px;white-space:nowrap}
.onl{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink);margin-inline:auto}
.onl i{width:9px;height:9px;border-radius:50%;background:var(--on);animation:ping 2.2s infinite}
.onl b{display:inline-block;font-weight:800}.onl b.bump{animation:pop .35s var(--ease)}
#title{font-size:25px;font-weight:800;color:var(--ink);padding:0 4px}
.tick{display:flex;align-items:center;height:38px;margin:12px 14px 0;border-radius:999px;overflow:hidden}
.tick .tl{flex:none;height:100%;padding:0 14px;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;background:var(--gum);color:var(--ink)}
.tick .tl i{font-size:11px}
.tick .vw{flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tk{display:flex;width:max-content;animation:tkR var(--d,30s) linear infinite}
.tick:hover .tk{animation-play-state:paused}
.ti{padding:0 12px;white-space:nowrap;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.ti i{font-style:normal;color:var(--mut)}.ti b{color:var(--ink)}
.ti s{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gum-d);margin-inline-start:16px}
@keyframes tkR{to{transform:translateX(50%)}}@keyframes tkL{to{transform:translateX(-50%)}}
html[dir=ltr] .tk{animation-name:tkL}
#views{flex:1;overflow:auto;padding:10px 0 96px}
#views.anim .row,#views.anim .opt,#views.anim .prof,#views.anim .empty,#views.anim .sq,#views.anim .out,#views.anim .h2,#views.anim .langs{animation:rise .45s var(--ease) both}
nav{order:3;align-self:center;display:flex;gap:4px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.9);border-radius:999px;margin:6px 14px max(12px,env(safe-area-inset-bottom));padding:4px}
nav button{display:flex;align-items:center;justify-content:center;gap:0;height:44px;min-width:44px;padding:0 12px;border-radius:999px;color:var(--mut);font-size:12.5px;font-weight:700;position:relative;white-space:nowrap}
nav button i.fa-solid{font-size:17px;display:grid;place-items:center}
nav button span[data-i]{max-width:0;opacity:0;overflow:hidden;transition:max-width .4s var(--ease),opacity .25s,margin .3s}
nav button.on{background:var(--gum);color:var(--ink);padding:0 16px}
nav button.on span[data-i]{max-width:90px;opacity:1;margin-inline-start:8px}
nav button.on>i{animation:pop .4s var(--ease)}
.badge{position:absolute;top:-3px;inset-inline-end:-3px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;animation:pop .35s var(--ease)}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:calc(100% - 20px);margin:2px 10px;border-radius:999px;text-align:start;transition:background .2s,transform .18s var(--ease)}
button.row:hover{background:rgba(255,255,255,.6)}button.row:active{transform:scale(.98)}.row.act{background:rgba(191,245,144,.5)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:700;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[dir=ltr] .meta b{text-align:left}
.meta b.gn{direction:inherit;text-align:start}
.meta small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:11px;color:var(--mut);align-self:flex-start;padding-top:3px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink);flex:none;position:relative;direction:ltr}
.av.sm{width:40px;height:40px;font-size:13px}.av.xl{width:80px;height:80px;font-size:27px}
.dot{position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;background:var(--off);transition:background .4s}
.dot.on{background:var(--on);animation:ping 2.2s infinite}
.chip{border:1.5px solid transparent;display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:999px;background:var(--gum);color:var(--ink);font-size:13px;font-weight:700;white-space:nowrap}
.chip i.fa-solid{font-size:12px}.chip:hover{background:var(--gum-d)}
.chip.ghost{background:rgba(255,255,255,.6);border-color:var(--line)}
.chip.red{background:rgba(253,232,232,.9);color:#c62828}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--gum);color:var(--ink);display:grid;place-items:center;flex:none}
.h2{font-size:12.5px;color:var(--mut);padding:14px 22px 4px;font-weight:500}
.empty{text-align:center;color:var(--mut);padding:40px 28px;line-height:2}
.ring{width:72px;height:72px;border-radius:50%;background:rgba(191,245,144,.5);border:1px solid rgba(255,255,255,.9);color:#3fbf1c;display:grid;place-items:center;margin:0 auto 10px;animation:floaty 3.4s ease-in-out infinite}
.ring i.fa-solid{font-size:28px}
.sq{padding:2px 14px 8px}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px 10px;text-align:center}
.opt{display:flex;align-items:center;gap:12px;width:calc(100% - 28px);margin:7px 14px;padding:13px 20px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.5);text-align:start;font-weight:500;cursor:pointer}
.opt input{display:none}.opt .t{flex:1}
.opt>i:first-of-type{color:var(--mut);width:18px;text-align:center}
.opt.on,.opt:has(input:checked){border-color:var(--gum-d);background:rgba(191,245,144,.5);font-weight:800}
.opt.on i,.opt:has(input:checked) i{color:#3fbf1c}
.opt label+i,.opt i:last-of-type:not(:first-of-type){opacity:0}
.opt.on i:last-of-type,.opt:has(input:checked) i:last-of-type{opacity:1}
.out{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 28px);margin:18px 14px;padding:13px;border-radius:999px;background:rgba(253,232,232,.9);color:#c62828;font-weight:700}
.fabs{position:absolute;left:16px;bottom:8px;display:flex;gap:8px;z-index:2}
.fab{display:flex;align-items:center;gap:9px;padding:14px 22px;border-radius:999px;background:var(--ink);color:var(--gum);font-weight:800;animation:pop .5s var(--ease)}
.fab2{width:50px;height:50px;border-radius:50%;background:var(--gum);color:var(--ink);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.9);animation:pop .5s .08s var(--ease) both}
/* chat */
#chat{position:absolute;inset:0;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);display:flex;flex-direction:column;z-index:5;animation:in .35s var(--ease)}
@keyframes in{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
#chead{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(191,245,144,.45);border-radius:0 0 30px 30px;border-bottom:1px solid rgba(255,255,255,.8)}
#chead .sub{font-size:12px;color:var(--mut)}#chead .sub.on{color:#0d8a33;font-weight:700}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.7);color:var(--ink)}
#msgs{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:4px}
.dsep{align-self:center;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);color:var(--mut);font-size:11.5px;padding:3px 12px;border-radius:999px;margin:10px 0 6px}
.b{max-width:78%;padding:8px 14px 6px;border-radius:22px;line-height:1.75;word-break:break-word;position:relative;white-space:pre-wrap;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.b.me{align-self:flex-start;background:rgba(191,245,144,.8);border:1px solid rgba(255,255,255,.7);color:var(--ink);border-top-right-radius:7px;transform-origin:top right}
.b.th{align-self:flex-end;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-top-left-radius:7px;transform-origin:top left}
html[dir=ltr] .b.me{align-self:flex-end}html[dir=ltr] .b.th{align-self:flex-start}
.b.pop{animation:pop .35s var(--ease)}
.b small{display:block;font-size:10px;opacity:.6;margin-top:1px}
.sn{display:block;font-size:11px;font-weight:800;color:#2f9a4d;direction:ltr;text-align:start}
.acts{position:absolute;right:100%;margin-right:8px;top:50%;transform:translateY(-50%);display:none;gap:6px}
.acts button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}
.acts button+button{color:#c62828}.acts i.fa-solid{font-size:12px}
.b.me:hover .acts,.b.me.sel .acts{display:flex;animation:pop .25s var(--ease)}
#editbar{display:flex;align-items:center;gap:10px;margin:0 14px 6px;padding:8px 8px 8px 16px;border-radius:999px;background:rgba(191,245,144,.55);font-size:12.5px;font-weight:700;color:var(--ink)}
#editbar span{flex:1}#editbar button{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.8)}
#bar{padding:8px 12px max(12px,env(safe-area-inset-bottom))}
.pillin{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 6px 5px 5px;transition:border-color .2s}
.pillin:focus-within{border-color:var(--gum-d)}
.pillin input{border:0;background:none;box-shadow:none;padding:9px 14px;flex:1;min-width:0}
.pillin input:focus{box-shadow:none;background:none}
.pillin button{width:44px;height:44px;border-radius:50%;background:var(--gum);color:var(--ink);display:grid;place-items:center;flex:none}
.pillin button:disabled{opacity:.4;transform:scale(.9)}
html[dir=rtl] .pillin button i.fa-paper-plane{transform:scaleX(-1)}
#ph{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .25s}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet{width:min(460px,100%);max-height:90%;overflow:auto;border-radius:32px 32px 0 0;padding:22px 14px calc(22px + env(safe-area-inset-bottom));animation:up .4s var(--ease)}
.sheet h3{font-size:19px;font-weight:800;color:var(--ink);padding:0 8px 10px}
.sheet .btn,.sheet .inp,.sheet .rw,.sheet .out{margin-inline:14px;width:calc(100% - 28px)}
.rw{display:flex;gap:8px;align-items:center}.rw input{flex:1;min-width:0}
.sheet .mut{padding:0 22px;color:var(--mut);display:block}

      +`<div class="h2">${t('g_link')}</div><div class="rw"><input type="text" dir="ltr" readonly value="${esc(link)}"><button class="chip" data-copy="${esc(link)}">${ic('copy')}${t('copy')}</button></div>`
      +`<div class="h2">${t('members',mem.length)}</div>`+mem.map(m=>`<div class="row" style="width:100%;margin:0">${av(m.user_id)}<div class="meta"><b>${esc(name(m.user_id))}</b></div>${m.role=='owner'?`<span class="chip ghost">${t('owner')}</span>`:''}</div>`).join('')
      +`<button class="out" ${own?`data-delg="${gid}">${ic('trash-can')}${t('delg')}`:`data-leave="${gid}">${ic('right-from-bracket')}${t('leave')}`}</button>`;
  }
  $('#sheet').classList.remove('hide');
}
async function afterJoin(id){closeSheet();await load();openGroup(id)}
async function joinCode(raw){
  const c=((raw||'').match(/join=([A-Za-z0-9]+)/)||[])[1]||(raw||'').trim();if(!c)return false;
  const {data,error}=await sb.rpc('join_group_by_code',{p_code:c});
  if(error||!data){toast(t('joinFail'));return false}toast(t('joined'));await afterJoin(data);return true;
}
async function tryHash(){const o=location.hash.match(/open=([gu]):([\w-]+)/);if(o){history.replaceState(null,'',location.pathname+location.search);return openFrom(o[1]=='g'?{grp:o[2]}:{chat:o[2]})}const m=location.hash.match(/join=([A-Za-z0-9]+)/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);await joinCode(m[1])}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});

/* ---------- actions ---------- */
document.addEventListener('click',async e=>{
  if(e.target.id=='sheet')return closeSheet();
  const bt=e.target.closest('button');if(bt&&bt.id!='snd')bt.blur();
  const x=e.target.closest('[data-tab],[data-chat],[data-grp],[data-add],[data-acc],[data-del],[data-priv],[data-dm],[data-ed],[data-ced],[data-back],[data-lang],[data-pick],[data-install],[data-notif],[data-snd],[data-sheet],[data-mk],[data-jc],[data-copy],[data-setm],[data-leave],[data-delg],[data-ginfo],[data-gjoin],#out,.b.me');if(!x)return;const d=x.dataset;
  if(d.tab){tab=d.tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));$('#views').innerHTML='';render();animate()}
  else if(d.pick){lang=d.pick;try{localStorage.setItem('gc_lang',lang)}catch(_){}langChosen=true;applyLang();$('#langpg').classList.add('hide');$('#auth').classList.remove('hide')}
  else if('install' in d){if(dip){dip.prompt();try{await dip.userChoice}catch(_){}dip=null;render()}else toast(t('inst_ios'))}
  else if('notif' in d){
    if(notifOn){notifOn=false;ls('gc_notif','0');render()}
    else if(!canNotif)toast(t('n_unsup'));
    else{const p=await Notification.requestPermission();if(p=='granted'){notifOn=true;ls('gc_notif','1');notify(t('brand'),t('notif'),'test',{})}else toast(t('n_denied'));render()}}
  else if('snd' in d){soundOn=!soundOn;ls('gc_snd',soundOn?'1':'0');if(soundOn)beep();render()}
  else if(d.lang){lang=d.lang;try{localStorage.setItem('gc_lang',lang)}catch(_){}applyLang()}
  else if('back' in d){other=grp=null;stopEdit();$('#chat').classList.add('hide');render()}
  else if(d.chat)openChat(d.chat);
  else if(d.grp)openGroup(d.grp);
  else if(d.add){const {error}=await sb.from('friendships').insert({requester:me,addressee:d.add});toast(error?t('err'):t('reqSent'));load()}
  else if(d.acc){await sb.from('friendships').update({status:'accepted'}).eq('id',d.acc);load()}
  else if(d.del){await sb.from('friendships').delete().eq('id',d.del);load()}
  else if(d.priv){const {error}=await sb.from('profiles').update({who_can_message:d.priv}).eq('id',me);if(!error){mine.who_can_message=d.priv;render()}}
  else if(d.dm){await sb.from(grp?'group_messages':'messages').delete().eq('id',d.dm);drawChat();load()}
  else if(d.ed){editing={id:d.ed,g:!!grp};$('#mt').value=MSG[d.ed]||'';$('#editbar').classList.remove('hide');$('#snd').innerHTML=ic('check');$('#snd').disabled=false;$('#mt').focus()}
  else if('ced' in d)stopEdit();
  else if(d.sheet)sheet(d.sheet);
  else if('ginfo' in d)sheet('info',grp);
  else if('mk' in d){const n=$('#gname').value.trim();if(!n)return $('#gname').focus();const m=document.querySelector('input[name=gm]:checked').value;
    const {data,error}=await sb.rpc('create_group',{p_name:n,p_mode:m});if(error||!data)$('#gerr').textContent=t('err');else afterJoin(data)}
  else if('jc' in d){if(!await joinCode($('#gcode').value))$('#gerr').textContent=t('joinFail')}
  else if(d.gjoin){const {data,error}=await sb.rpc('join_group',{p_group:d.gjoin});if(error||!data)toast(t('joinFail'));else{toast(t('joined'));afterJoin(data)}}
  else if(d.copy){try{await navigator.clipboard.writeText(d.copy)}catch(_){}toast(t('copied'))}
  else if(d.setm){await sb.from('groups').update({join_mode:d.setm}).eq('id',d.g);await load();sheet('info',d.g)}
  else if(d.leave){await sb.from('group_members').delete().eq('group_id',d.leave).eq('user_id',me);closeSheet();if(grp==d.leave){grp=null;$('#chat').classList.add('hide')}load()}
  else if(d.delg){await sb.from('groups').delete().eq('id',d.delg);closeSheet();if(grp==d.delg){grp=null;$('#chat').classList.add('hide')}load()}
  else if(x.id=='out')sb.auth.signOut();
  else if(x.classList.contains('b'))x.classList.toggle('sel');
});

/* ---------- start ---------- */
applyLang();
try{
  if(SUPABASE_URL&&SUPABASE_ANON_KEY){
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange((_,s)=>setTimeout(async()=>{await boot(s);endSplash()},0));
  }else endSplash();
}catch(e){sb=null;endSplash()}
</script>
</body>
</html>
